<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f2e9">
  <meta name="description" content="《十二籃》正體中文閱讀器">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="十二籃">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>十二籃｜閱讀器</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="#/home" aria-label="十二籃首頁"><img class="wordmark-mark" src="icons/icon-192.png" alt="" aria-hidden="true"><span>十二籃</span></a>
    <nav class="topnav" aria-label="主要導覽">
      <a href="#/home" data-nav="home">書架</a>
      <a href="#/bookmarks" data-nav="bookmarks">書籤 <span id="bookmark-count" class="nav-count">0</span></a>
    </nav>
    <button class="icon-button theme-toggle" id="theme-toggle" type="button" aria-label="切換閱讀主題" title="切換閱讀主題">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.1A8.4 8.4 0 0 1 8.9 3.8 8.5 8.5 0 1 0 20.2 15.1Z"/></svg>
    </button>
  </header>
  <main id="app" tabindex="-1" aria-live="polite">
    <div class="loading"><span></span>正在打開書架</div>
  </main>
  <footer class="site-footer"><span>《十二籃》</span><span>在基督裡</span></footer>
</body>
</html>
